<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="Zotero Linked Mindmaps">
  <title>Zotero Linked Mindmaps</title>

  <!-- The mark is the plugin's shipped item-pane icon, spread out for display
       size: three nodes, one directional link and one undirected, which is the
       distinction the whole plugin is built on. -->
  <g transform="translate(50 28)">
    <line x1="35.41" y1="28.02" x2="68.05" y2="37.82"
          stroke="#8a97a8" stroke-width="3.5" stroke-dasharray="7 5" stroke-linecap="round"/>
    <path d="M78.59 40.98 L66.33 32.07 L69.77 43.57 Z" fill="#8a97a8"/>
    <line x1="25.95" y1="37.43" x2="38.05" y2="78.57"
          stroke="#8a97a8" stroke-width="3.5" stroke-linecap="round"/>

    <circle cx="22" cy="24" r="14" fill="#cfe3fb" stroke="#4a90d9" stroke-width="3"/>
    <circle cx="92" cy="45" r="14" fill="#cfe3fb" stroke="#4a90d9" stroke-width="3"/>
    <circle cx="42" cy="92" r="14" fill="#cfe3fb" stroke="#4a90d9" stroke-width="3"/>
  </g>

  <text x="196" y="92"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="44" font-weight="600" fill="#5b8db8">Zotero Linked Mindmaps</text>
  <text x="198" y="126"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" fill="#7d8896">Typed, named links between the sources you already have</text>
</svg>
