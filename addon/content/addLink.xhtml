<?xml version="1.0"?>
<!--
  Shell for the standalone "Add link" window opened from the library context
  menu. It carries no script of its own: openAddLinkDialog renders the form
  into the container below once the window has loaded, the same form the item
  pane and the mindmap tab build.

  This is a real chrome document rather than the blank window a
  ztoolkit.Dialog opens, because an HTML select's dropdown does not open in
  that blank window - see docs/internals/locale-reference.md.
-->
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  id="zoterolinkedmindmaps-add-link-window"
  data-l10n-id="zoterolinkedmindmaps-add-link-window"
  data-l10n-attrs="title"
  width="480"
  height="360"
>
  <linkset>
    <html:link rel="stylesheet" href="chrome://global/skin/global.css" />
    <html:link
      rel="stylesheet"
      href="chrome://zotero-platform/content/zotero.css"
    />
    <html:link rel="localization" href="zoterolinkedmindmaps-mainWindow.ftl" />
  </linkset>

  <html:div id="zoterolinkedmindmaps-add-link-dialog-content" />
</window>
