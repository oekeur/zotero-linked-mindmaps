<linkset>
  <html:link rel="localization" href="zoterolinkedmindmaps-addon.ftl" />
</linkset>
<groupbox
  aria-labelledby="zoterolinkedmindmaps-link-types-heading"
  onload="
    Zotero.ZoteroLinkedMindmaps.hooks.onPrefsEvent('link-types-pane-load', {
      container: this.querySelector(
        '.zoterolinkedmindmaps-link-types-container',
      ),
    })
  "
>
  <label>
    <html:h2
      id="zoterolinkedmindmaps-link-types-heading"
      data-l10n-id="zoterolinkedmindmaps-preferences-heading"
    />
  </label>
  <html:div class="zoterolinkedmindmaps-link-types-container"></html:div>
</groupbox>
<groupbox aria-labelledby="zoterolinkedmindmaps-library-heading">
  <label>
    <html:h2
      id="zoterolinkedmindmaps-library-heading"
      data-l10n-id="zoterolinkedmindmaps-preferences-library-heading"
    />
  </label>
  <checkbox
    class="zoterolinkedmindmaps-hide-mindmap-notes"
    preference="hideMindmapNotes"
    data-l10n-id="zoterolinkedmindmaps-preferences-hide-mindmap-notes"
  />
  <description
    class="zoterolinkedmindmaps-hide-mindmap-notes-help description-deemphasized"
    data-l10n-id="zoterolinkedmindmaps-preferences-hide-mindmap-notes-help"
  />
</groupbox>
<groupbox aria-labelledby="zoterolinkedmindmaps-feedback-heading">
  <label>
    <html:h2
      id="zoterolinkedmindmaps-feedback-heading"
      data-l10n-id="zoterolinkedmindmaps-preferences-feedback-heading"
    />
  </label>
  <html:div class="zoterolinkedmindmaps-feedback-buttons">
    <button
      class="zoterolinkedmindmaps-feedback-bug"
      data-l10n-id="zoterolinkedmindmaps-preferences-feedback-bug-button"
      oncommand="
        Zotero.ZoteroLinkedMindmaps.hooks.onPrefsEvent('report-bug', {})
      "
    />
    <button
      class="zoterolinkedmindmaps-feedback-feature"
      data-l10n-id="zoterolinkedmindmaps-preferences-feedback-feature-button"
      oncommand="
        Zotero.ZoteroLinkedMindmaps.hooks.onPrefsEvent('request-feature', {})
      "
    />
  </html:div>
  <description
    class="zoterolinkedmindmaps-feedback-help description-deemphasized"
    data-l10n-id="zoterolinkedmindmaps-preferences-feedback-help"
  />
</groupbox>
